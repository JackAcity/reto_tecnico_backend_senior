name: Verify

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-\${{ github.workflow }}-\${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  workflow-policy:
    name: workflow-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Enforce workflow policy and adversarial fixture
        shell: pwsh
        run: ./scripts/ci/Assert-Gate2AWorkflowPolicy.ps1

  secret-policy:
    name: secret-policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Scan source and prove synthetic-secret detection
        shell: pwsh
        run: ./scripts/ci/Assert-Gate2ASecretPolicy.ps1

  backend:
    name: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.110
      - name: Restore solution
        run: dotnet restore Reto.slnx --disable-build-servers
      - name: Build solution
        run: dotnet build Reto.slnx --no-restore --disable-build-servers -m:1 -p:UseSharedCompilation=false -c Release

  frontend:
    name: frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.13.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build
        run: npm run build

  integration:
    name: integration
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 1
      - name: Install .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.110
      - name: Materialize non-secret development configuration
        shell: pwsh
        run: Copy-Item .env.example .env
      - name: Start the stack from this commit
        run: docker compose up -d --build --wait --wait-timeout 240
      - name: Restore test project
        run: dotnet restore tests/Reto.Tests/Reto.Tests.csproj --disable-build-servers
      - name: Run integration suite
        run: dotnet test tests/Reto.Tests/Reto.Tests.csproj --no-restore --disable-build-servers -m:1 -c Release --blame-hang --blame-hang-timeout 5m --logger "console;verbosity=minimal"
      - name: Show container diagnostics after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove ephemeral CI stack
        if: always()
        run: docker compose down --volumes --remove-orphans
