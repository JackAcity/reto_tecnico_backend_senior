name: reto-carga-masiva

x-servicio-net: &servicio-net
  restart: unless-stopped
  environment: &env-net
    ASPNETCORE_ENVIRONMENT: Development
    ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    RabbitMq__Host: rabbitmq
    RabbitMq__Usuario: ${RABBITMQ_USER}
    RabbitMq__Password: ${RABBITMQ_PASSWORD}
    SeaweedFs__Filer: http://seaweedfs:8888
    Jwt__Key: ${JWT_KEY}
    Jwt__Issuer: ${JWT_ISSUER}
    Jwt__Audience: ${JWT_AUDIENCE}
    Jwt__ExpiraMinutos: ${JWT_EXPIRA_MINUTOS}
    Jwt__RefreshExpiraDias: ${JWT_REFRESH_EXPIRA_DIAS}
    Carga__TamanoMaximoMb: ${CARGA_TAMANO_MAXIMO_MB}
  healthcheck:
    test: ["CMD", "curl", "-fsS", "http://localhost:8080/health"]
    interval: 10s
    timeout: 3s
    retries: 10
    start_period: 20s

services:
  # ---------- Infraestructura ----------
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    # 127.0.0.1 y no 0.0.0.0: "5432:5432" publica en TODAS las interfaces, o sea
    # alcanzable desde cualquier otra máquina en la misma red que la del evaluador.
    # Con credenciales de ejemplo en .env, eso es una base de datos abierta a la
    # LAN. Acotar a loopback no rompe nada: psql/EF/tests siguen usando localhost.
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    # Loopback-only por la misma razón que postgres — el 15672 queda igual de
    # accesible para grabar el video (localhost:15672 en el navegador del propio
    # evaluador), pero ya no expuesto a la LAN.
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"   # consola de administración — se muestra en el video
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -master.volumeSizeLimitMB=64 -filer -s3
    ports:
      - "127.0.0.1:9333:9333"   # master
      - "127.0.0.1:8888:8888"   # filer (HTTP API que usa Control)
      - "127.0.0.1:8333:8333"   # gateway S3
    volumes: ["seaweeddata:/data"]
    healthcheck:
      # 127.0.0.1 y no "localhost": el wget de BusyBox resuelve localhost a ::1
      # y SeaweedFS solo escucha en IPv4 → "connection refused" permanente.
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 10s
      timeout: 5s
      retries: 20

  mailpit:
    # Servidor SMTP local: el correo enviado con MailKit se ve en la UI web,
    # sin credenciales reales. Imprescindible para la demo en video.
    image: axllent/mailpit:latest
    ports:
      - "127.0.0.1:1025:1025"   # SMTP
      - "127.0.0.1:8025:8025"   # UI web
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

  database-migrator:
    # Componente de despliegue: aplica el esquema versionado y termina. Ningún
    # servicio de negocio conoce migraciones ni modelos de los otros servicios.
    restart: "no"
    environment:
      ConnectionStrings__Postgres: Host=postgres;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
    build: { context: ., dockerfile: src/DatabaseMigrator/Dockerfile }
    depends_on:
      postgres: { condition: service_healthy }
  # ---------- Microservicios ----------
  gateway:
    <<: *servicio-net
    environment:
      <<: *env-net
      # No es "el mismo tipo de config que un password", pero el principio es el
      # mismo: si esto faltara, un fallback silencioso apuntaría a un nombre de
      # host que puede no existir fuera de esta red de contenedores. Explícito acá,
      # y Program.cs falla al arrancar si falta — igual que el resto.
      Servicios__Auth: http://auth:8080/
      Servicios__Control: http://control:8080/
      Servicios__CargaMasiva: http://cargamasiva:8080/
      Servicios__Notificaciones: http://notificaciones:8080/
      # Origen del cliente React (Vite dev). Program.cs ya trae este default si falta.
      Cors__OrigenesPermitidos: ${CORS_ORIGENES_PERMITIDOS:-http://localhost:5173}
    build: { context: ., dockerfile: src/Gateway/Dockerfile }
    # Única puerta pública del sistema (design.md): también acotada a loopback,
    # nada obliga a que sea alcanzable desde la LAN del evaluador.
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      auth:          { condition: service_healthy }
      control:       { condition: service_healthy }

  auth:
    <<: *servicio-net
    environment:
      <<: *env-net
      Seed__Email: ${SEED_EMAIL}
      Seed__Password: ${SEED_PASSWORD}
      Seed__Rol: ${SEED_ROL}
      Seed__ConsultaEmail: ${SEED_CONSULTA_EMAIL}
      Seed__ConsultaPassword: ${SEED_CONSULTA_PASSWORD}
      Seed__ConsultaRol: ${SEED_CONSULTA_ROL}
    build: { context: ., dockerfile: src/Services/Auth/Auth.Api/Dockerfile }
    depends_on:
      # Auth necesita el esquema disponible, no que otro servicio de negocio esté iniciado.
      database-migrator: { condition: service_completed_successfully }

  control:
    <<: *servicio-net
    build: { context: ., dockerfile: src/Services/Control/Control.Api/Dockerfile }
    depends_on:
      database-migrator: { condition: service_completed_successfully }
      rabbitmq:          { condition: service_healthy }
      seaweedfs:         { condition: service_healthy }

  cargamasiva:
    <<: *servicio-net
    build: { context: ., dockerfile: src/Services/CargaMasiva/CargaMasiva.Api/Dockerfile }
    depends_on:
      database-migrator: { condition: service_completed_successfully }
      rabbitmq:          { condition: service_healthy }
      seaweedfs:         { condition: service_healthy }

  notificaciones:
    <<: *servicio-net
    environment:
      <<: *env-net
      Smtp__Host: ${SMTP_HOST}
      Smtp__Puerto: ${SMTP_PORT}
      Smtp__Usuario: ${SMTP_USER}
      Smtp__Password: ${SMTP_PASSWORD}
      Smtp__Desde: ${SMTP_DESDE}
      Smtp__UsarSsl: ${SMTP_USAR_SSL}
    build: { context: ., dockerfile: src/Services/Notificaciones/Notificaciones.Api/Dockerfile }
    depends_on:
      database-migrator: { condition: service_completed_successfully }
      rabbitmq:          { condition: service_healthy }
      mailpit:           { condition: service_healthy }

volumes:
  pgdata:
  seaweeddata:
