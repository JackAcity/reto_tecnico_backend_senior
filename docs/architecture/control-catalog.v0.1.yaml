catalog_version: "0.1"
status: "design-only"
accessed_on: "2026-08-11"
controls:
  - control_id: "CTL-001"
    name: "Integración de mainline protegida"
    objective: "Impedir cambios no autorizados en una rama confiable."
    risk_addressed: "Bypass de revisión, modificación de controles y compromiso de repositorio."
    requirement: "La integración confiable satisface autorización y gates definidos por perfil."
    source_basis: "SRC-NIST-SSDF-1.1; SRC-GH-RULESETS"
    source_strength_status: "NIST final más capacidad GitHub; no requisito universal de ruleset."
    applicability: "Todos los repositorios con rama confiable."
    implementation_neutral_control: "Proteger rama, exigir integración revisable y evaluar gates antes de aceptar."
    github_implementation_candidate: "Ruleset con PR, revisiones, checks y bypass limitado; candidato."
    verification_method: "Intentar push/merge sin revisión y con gate fallido; debe rechazarse."
    expected_evidence: "Snapshot de regla, PR fallido, revisión y commit de merge."
    failure_condition: "Cambio no autorizado entra o requisitos no son demostrables."
    severity: "high"
    exceptions: "Emergencia con dueño, ticket, vencimiento y revisión posterior."
    residual_risk: "Bypass administrativo o identidad/revisión comprometida."
    owner: "Dueño de repositorio y seguridad de ingeniería."
  - control_id: "CTL-002"
    name: "Build reproducible y CI"
    objective: "Producir resultados identificables y detectar integración rota temprano."
    risk_addressed: "Build no determinista, dependencia implícita y divergencia de entorno."
    requirement: "Cada cambio aplicable ejecuta definición versionada y registra inputs/resultados."
    source_basis: "SRC-NIST-SSDF-1.1; SRC-DORA-CD"
    source_strength_status: "NIST final más evidencia de investigación."
    applicability: "Todos; comparación bit a bit depende del artefacto."
    implementation_neutral_control: "Versionar build, toolchain e inputs; ejecutar y conservar checks."
    github_implementation_candidate: "Workflow CI versionado con resultado exportable; candidato."
    verification_method: "Reconstruir mismo commit y contrastar resultado o variación explicada."
    expected_evidence: "Commit, lockfiles, toolchain, logs, resultados y hashes cuando apliquen."
    failure_condition: "No se identifica o reconstruye el resultado declarado."
    severity: "high"
    exceptions: "Not-applicable documentado para cambio puramente documental."
    residual_risk: "Compilador, runner o dependencia comprometidos."
    owner: "Ingeniería de plataforma."
  - control_id: "CTL-003"
    name: "Calidad y pruebas automatizadas"
    objective: "Evitar promover regresiones conocidas."
    risk_addressed: "Defectos funcionales, de integración o arquitectura no detectados."
    requirement: "Los cambios ejecutan verificaciones proporcionales antes de integrarse."
    source_basis: "SRC-NIST-SSDF-1.1; SRC-DORA-CD"
    source_strength_status: "NIST final más evidencia de investigación."
    applicability: "Todos; conjunto de pruebas según superficie."
    implementation_neutral_control: "Ejecutar tests/análisis definidos y bloquear promoción cuando fallen."
    github_implementation_candidate: "Checks requeridos de CI y resultados conservados; candidato."
    verification_method: "Fixture con prueba fallida debe impedir integración."
    expected_evidence: "Resultado de test, diagnóstico y decisión de gate."
    failure_condition: "Prueba fallida no bloquea cuando el perfil lo exige."
    severity: "high"
    exceptions: "No aplicable explícito; no ignorar fallos sin excepción temporal."
    residual_risk: "Falsos negativos y defectos emergentes."
    owner: "Equipo responsable del componente."
  - control_id: "CTL-004"
    name: "Gobernanza de dependencias"
    objective: "Conocer y gestionar componentes de terceros de manera trazable."
    risk_addressed: "Vulnerabilidad, licencia no aprobada o compromiso upstream."
    requirement: "Cambios de dependencia y vulnerabilidades relevantes son identificables y gestionados."
    source_basis: "SRC-NIST-SSDF-1.1; SRC-OPENSSF-SSDGP"
    source_strength_status: "NIST final más guía oficial OpenSSF."
    applicability: "Medio/alto; bajo cuando no cambia dependencia ni build."
    implementation_neutral_control: "Inventario, lockfiles, análisis de composición y excepción temporal."
    github_implementation_candidate: "Dependency review, alertas y SCA; candidatos."
    verification_method: "Fixture vulnerable y fixture limpio miden detección y falsos positivos."
    expected_evidence: "Diff de lockfile, informe, decisión de riesgo y SBOM si aplica."
    failure_condition: "Dependencia bloqueante entra sin finding o excepción aprobada."
    severity: "high"
    exceptions: "CVE/paquete, compensación, dueño y fecha de revisión."
    residual_risk: "Vulnerabilidad desconocida o datos de vulnerabilidad incompletos."
    owner: "Seguridad de ingeniería y dueño del componente."
  - control_id: "CTL-005"
    name: "Protección de secretos"
    objective: "Prevenir, detectar y responder a exposición de credenciales."
    risk_addressed: "Secreto hardcodeado o filtrado por código, log o artefacto."
    requirement: "Secretos no se almacenan en fuente; exposiciones se detectan y revocan."
    source_basis: "SRC-NIST-SSDF-1.1; SRC-GH-ACTIONS-SEC"
    source_strength_status: "NIST final más guía/capacidad GitHub."
    applicability: "Todos."
    implementation_neutral_control: "Almacén de secretos, prevención, detección y runbook de revocación."
    github_implementation_candidate: "Secret scanning, push protection y secrets por environment; candidatos."
    verification_method: "Fixture sintético debe alertar o bloquear sin guardar secreto real."
    expected_evidence: "Resultado de detector y respuesta de remediación simulada."
    failure_condition: "Credencial plausible no tiene bloqueo, alerta ni respuesta."
    severity: "critical"
    exceptions: "No se exceptúan secretos reales; solo fixtures sintéticos documentados."
    residual_risk: "Formato no reconocido o uso previo a detección."
    owner: "Seguridad de ingeniería."
  - control_id: "CTL-006"
    name: "Seguridad de workflows y acciones"
    objective: "Evitar ejecución no confiable con privilegios."
    risk_addressed: "Trigger inseguro, acción mutable y exfiltración de token."
    requirement: "Automatización revisada separa input no confiable de secretos y privilegios."
    source_basis: "SRC-GH-ACTIONS-SEC; SRC-NIST-SSDF-1.1"
    source_strength_status: "Guía/capacidad GitHub más NIST final."
    applicability: "Todo repositorio con automatización."
    implementation_neutral_control: "Inventariar, fijar identidad/versiones, revisar workflows y aislar inputs."
    github_implementation_candidate: "Allowlist, SHA completo, workflow protection y política de eventos; candidatos."
    verification_method: "Auditor detecta tag mutable y PR privilegiado; no marca patrón seguro."
    expected_evidence: "Inventario, auditoría, diff revisado y política."
    failure_condition: "Referencia mutable o PR no confiable privilegiado pasa sin finding."
    severity: "critical"
    exceptions: "Evaluación de proveedor, compensación y vencimiento; nunca evento inseguro."
    residual_risk: "Commit fijado, runner o proveedor comprometidos."
    owner: "Plataforma y seguridad de ingeniería."
  - control_id: "CTL-007"
    name: "Privilegio mínimo e identidad no humana"
    objective: "Conceder solo permiso, identidad y duración necesarios."
    risk_addressed: "Token/App excesivo y credencial cloud persistente."
    requirement: "Identidades no humanas se separan, minimizan y verifican."
    source_basis: "SRC-GH-OIDC; SRC-GH-ACTIONS-SEC"
    source_strength_status: "Capacidad/guía GitHub y decisión de ingeniería."
    applicability: "Todos; estricto en alto riesgo."
    implementation_neutral_control: "Roles por función, scope mínimo, credencial efímera y prueba de denegación."
    github_implementation_candidate: "permissions por job, App limitada y OIDC condicionado; candidatos."
    verification_method: "Operación fuera de scope debe ser denegada."
    expected_evidence: "Política, claims/rol, prueba de autorización y auditoría."
    failure_condition: "Identidad escribe, despliega o lee secreto sin necesidad demostrada."
    severity: "critical"
    exceptions: "Temporal, aprobada por seguridad, scope y fecha explícitos."
    residual_risk: "Abuso dentro de scope o configuración cloud errónea."
    owner: "Plataforma y seguridad."
  - control_id: "CTL-008"
    name: "Aislamiento de runners"
    objective: "Evitar contaminación y acceso lateral entre ejecuciones."
    risk_addressed: "Runner comprometido, cache contaminada y secretos expuestos a PR."
    requirement: "Cargas no confiables y privilegiadas tienen aislamiento proporcional."
    source_basis: "SRC-GH-ENV; SRC-GH-ACTIONS-SEC"
    source_strength_status: "Capacidad/guía GitHub."
    applicability: "Medio/alto; obligatorio antes de runner self-hosted."
    implementation_neutral_control: "Clasificar runners, aislar/limpiar y negar PR no confiable en privilegiados."
    github_implementation_candidate: "Hosted o self-hosted efímero etiquetado y política de selección; candidatos."
    verification_method: "PR no confiable no puede seleccionar runner privilegiado."
    expected_evidence: "Inventario runner, selección de job, base y prueba negativa."
    failure_condition: "Código no confiable llega a runner con secreto o red productiva."
    severity: "critical"
    exceptions: "Amenaza aceptada, segmentación y revisión periódica documentadas."
    residual_risk: "Compromiso de imagen base, hipervisor o proveedor."
    owner: "Plataforma."
  - control_id: "CTL-009"
    name: "Integridad de artefacto, SBOM y provenance"
    objective: "Relacionar artefacto consumido con fuente y build verificables."
    risk_addressed: "Sustitución, inventario incompleto y provenance no verificable."
    requirement: "Promoción medio/alto usa digest y evidencia de procedencia verificable."
    source_basis: "SRC-SLSA-1.2; SRC-GH-ATTEST"
    source_strength_status: "Especificación SLSA más capacidad/guía GitHub."
    applicability: "Medio/alto; no aplica a salida no distribuible."
    implementation_neutral_control: "Publicar por digest, generar composición/provenance y verificar política."
    github_implementation_candidate: "Artifact attestation y SBOM vinculados a digest; candidatos."
    verification_method: "Rechazar subject/commit incorrecto o evidence ausente; aceptar válido."
    expected_evidence: "Digest, SBOM, provenance, resultado de verify y política."
    failure_condition: "Se acepta tag mutable o evidencia no verificable como identidad única."
    severity: "critical"
    exceptions: "Solo artefacto no distribuible justificado; nunca tag por digest en alto riesgo."
    residual_risk: "Builder comprometido, política débil o vulnerabilidades de contenido."
    owner: "Plataforma y dueño de release."
  - control_id: "CTL-010"
    name: "Autorización de despliegue y environments"
    objective: "Evitar despliegue o acceso entre entornos sin autorización."
    risk_addressed: "Self-approval, bypass y escalación de environment."
    requirement: "Alto riesgo requiere decisión separada, identidad limitada y destino demostrable."
    source_basis: "SRC-GH-ENV; SRC-GH-OIDC"
    source_strength_status: "Capacidades GitHub y decisión de ingeniería."
    applicability: "Alto; medio con ambiente compartido o datos persistentes."
    implementation_neutral_control: "Separar entornos, roles, secretos y promociones; impedir autoaprobación."
    github_implementation_candidate: "Environments protegidos, reviewers, no self-review, refs y OIDC; candidatos."
    verification_method: "Self-approval y deployment no autorizado deben bloquearse y auditarse."
    expected_evidence: "Configuración environment, approval, claims, deployment log y digest."
    failure_condition: "Actor no autorizado despliega o aprueba destino protegido."
    severity: "critical"
    exceptions: "Emergencia visible con responsable y revisión posterior."
    residual_risk: "Compromiso de aprobador, administrador o cloud."
    owner: "Dueño de riesgo, plataforma y operación."
  - control_id: "CTL-011"
    name: "Observabilidad, rollback y recuperación"
    objective: "Diagnosticar impacto, recuperar servicio e identificar versión ejecutada."
    risk_addressed: "Incidente prolongado y despliegue no atribuible."
    requirement: "Riesgo medio/alto declara señales y recuperación compatible."
    source_basis: "SRC-DORA-CD; SRC-NIST-SSDF-1.1"
    source_strength_status: "Investigación DORA más NIST final."
    applicability: "Medio y alto."
    implementation_neutral_control: "Emitir versión/health, conservar eventos y probar rollback/restauración."
    github_implementation_candidate: "Deployments/environments enlazados a observabilidad y runbook; candidatos."
    verification_method: "Drill consulta artefacto, approval, health y recuperación."
    expected_evidence: "Runbook, log de drill, métricas/eventos y digest restaurado."
    failure_condition: "No se determina versión ni recupera dentro del objetivo aprobado."
    severity: "high"
    exceptions: "Irreversibilidad aceptada con plan alternativo explícito."
    residual_risk: "Daño de datos, fallo regional u observabilidad insuficiente."
    owner: "Operación y dueño del servicio."
  - control_id: "CTL-012"
    name: "Gobernanza de agentes de código"
    objective: "Acelerar candidatos sin convertir agentes en autoridad de confianza."
    risk_addressed: "Cambio inseguro por IA, fuga de contexto y autoaprobación."
    requirement: "Agente no es único generador, verificador, aprobador, integrador y desplegador material."
    source_basis: "SRC-OPENAI-CODEX; SRC-DORA-CD"
    source_strength_status: "Guía OpenAI más decisión de ingeniería."
    applicability: "Todo cambio asistido por agente."
    implementation_neutral_control: "Separar intención humana, candidato, verificación independiente y aprobación."
    github_implementation_candidate: "PR trazable, checks independientes, CODEOWNERS real y bot mínimo; candidatos."
    verification_method: "Caso de autoaprobación/merge/deploy por agente debe fallar o requerir humano."
    expected_evidence: "Diff, verificadores, revisión humana y auditoría de identidad."
    failure_condition: "Agente completa autónomamente toda la cadena de confianza."
    severity: "critical"
    exceptions: "Solo simulación aislada sin producción ni datos sensibles."
    residual_risk: "Error semántico no detectado o fuga por herramienta autorizada."
    owner: "Ingeniería, seguridad y dueño de producto."
  - control_id: "CTL-013"
    name: "Cambios de datos e infraestructura gobernados"
    objective: "Evitar cambios irreversibles o inseguros de datos e infraestructura."
    risk_addressed: "Pérdida/corrupción, drift, IAM/red expuestos."
    requirement: "Cambio persistente/IaC declara impacto, compatibilidad, validación y recuperación."
    source_basis: "SRC-NIST-SSDF-1.1; SRC-DORA-CD"
    source_strength_status: "NIST final más evidencia de investigación."
    applicability: "Medio/alto cuando cambia DB, secretos, red, IAM o IaC."
    implementation_neutral_control: "Versionar plan, validar, usar cambios compatibles y probar restauración."
    github_implementation_candidate: "Checks migración/IaC, environment approval y plan; candidatos."
    verification_method: "Fixture destructivo/expuesto exige plan y aprobación."
    expected_evidence: "Plan, diff, validación, backup/restore drill y approval."
    failure_condition: "Cambio se promueve sin impacto, validación o recuperación demostrable."
    severity: "critical"
    exceptions: "Aceptación por dueño de datos/infra con ventana y recuperación."
    residual_risk: "Fallo de proveedor, error humano o cambio irreversible aprobado."
    owner: "Dueño de datos, plataforma y operación."
  - control_id: "CTL-014"
    name: "Estrategia de promoción y progressive delivery proporcional"
    objective: "Reducir blast radius cuando una liberación de alto impacto justifique exposición gradual."
    risk_addressed: "Fallo amplio de un release irreversible o difícil de detectar."
    requirement: "La estrategia de promoción se selecciona por riesgo, reversibilidad, observabilidad y capacidad real de rollback."
    source_basis: "SRC-DORA-CD; ENGINEERING DECISION"
    source_strength_status: "DORA aporta evidencia de entrega/observabilidad; progressive delivery no se impone como requisito universal."
    applicability: "Alto riesgo con runtime que soporte segmentación, health y rollback; de otro modo not-applicable justificado."
    implementation_neutral_control: "Decidir explícitamente rolling, canary, blue-green u otra estrategia y medir su criterio de abortar/revertir."
    github_implementation_candidate: "Environment protegido que orquesta proveedor externo; GitHub no implementa por sí solo rollout progresivo."
    verification_method: "Caso de alto riesgo demuestra criterio de avance/abortado; caso no aplicable no recibe falso finding."
    expected_evidence: "Decisión de estrategia, segmentos, health signals, límite de abortar y drill de rollback."
    failure_condition: "Se exige canary sin capacidad técnica o se despliega alto riesgo sin estrategia/recuperación evaluada."
    severity: "high"
    exceptions: "Not-applicable con justificación de perfil; excepción temporal requiere dueño y vencimiento."
    residual_risk: "Señales tardías, segmentación defectuosa o fallo común a todos los segmentos."
    owner: "Operación y dueño de riesgo."
  - control_id: "CTL-015"
    name: "Gobernanza de reusable workflows"
    objective: "Reutilizar automatización sin heredar secretos, permisos o referencias no gobernadas."
    risk_addressed: "Workflow compartido mutable, escalación de permisos y propagación implícita de secretos."
    requirement: "Los workflows reutilizables tienen contrato de inputs, secretos, permisos, identidad y versión verificable."
    source_basis: "SRC-GH-REUSABLE; SRC-GH-ACTIONS-SEC"
    source_strength_status: "Capacidad/guía GitHub; la necesidad conceptual es decisión de ingeniería."
    applicability: "Cuando una organización o repositorio introduzca workflow_call/reusable workflow."
    implementation_neutral_control: "Versionar contratos, fijar referencias externas, minimizar secretos e inventariar consumidores."
    github_implementation_candidate: "workflow_call con inputs/secrets explícitos, referencia SHA externa y revisión de .github/workflows; candidato."
    verification_method: "Fixture con ref mutable o secrets inherit injustificado falla; fixture explícito y SHA válido pasa."
    expected_evidence: "Contrato versionado, referencia inmutable, permisos efectivos, inventario de consumidores y resultados."
    failure_condition: "Reusable workflow recibe secreto/permiso implícito o cambia sin identidad verificable."
    severity: "high"
    exceptions: "Solo workflow local del mismo commit con justificación; no se usa para bypass de política."
    residual_risk: "Commit confiado comprometido, contrato mal diseñado o consumidor no inventariado."
    owner: "Plataforma y seguridad de ingeniería."
